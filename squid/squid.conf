#
# Squid configuration for the School AI Filter.
#
# Verified 2026-09-25 on OpenWrt 25.12.5 (armsr/armv8, Squid 7.1) in the QEMU
# VM: this config bumps Google, splices everything else, and rewrites
# /search to udm=14 against live Google.
#
# This is the EXPLICIT-PROXY form used for testing (Stage 2a). Transparent
# interception (Stage 2b) replaces http_port with an intercepting port plus
# nftables redirects.
#

# ssl-bump on an explicit proxy port bumps the CONNECT tunnel.
http_port 3128 ssl-bump generate-host-certificates=on \
    dynamic_cert_mem_cache_size=4MB \
    tls-cert=/etc/squid/ssl/ca.crt tls-key=/etc/squid/ssl/ca.key

sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/cache/squid/ssl_db -M 4MB
sslcrtd_children 2

acl gsearch ssl::server_name .google.com

# IMPORTANT: peek must be restricted to step 1.
#
# The obvious-looking "ssl_bump peek all" DOES NOT WORK. Rules are evaluated
# again at step 2, where "peek all" matches a second time; after peeking at
# step 2 Squid can only splice, so the bump rule is never reached and every
# connection is tunnelled. Verified: access.log showed TCP_TUNNEL/200 for
# every request until this was fixed.
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump bump gsearch
ssl_bump splice all

url_rewrite_program /usr/bin/udm14.lua
url_rewrite_children 5 startup=1 idle=1 concurrency=0

# Passes the Sec-Fetch-Mode request header to the helper as a trailing field.
# Verified working: arrives as "sfm=navigate", or "sfm=-" when absent.
url_rewrite_extras "sfm=%{Sec-Fetch-Mode}>h rm=%>rm"

acl localnet src 127.0.0.1/32 10.0.0.0/8 192.168.0.0/16
http_access allow localnet
http_access deny all

cache deny all
access_log /var/log/squid/access.log squid
